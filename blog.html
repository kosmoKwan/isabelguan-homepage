<style>
  :root {
    --cream: #FFF4E0;
    --cream-2: #FFEAC2;
    --ink: #2E2418;
    --ink-soft: #5C4A37;
    --ink-mute: #8E7E69;
    --rule: rgba(46, 36, 24, 0.14);
    --pink: #FF4D8D;
    --yellow: #FFCB3A;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .mono { font-family: 'DM Mono', 'Courier New', monospace; }
  .nav {
    position: sticky;
    top: 16px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 16px;
    padding: 12px 20px;
    border-radius: 100px;
    background: var(--pink);
    color: var(--cream);
  }
  .nav-links {
    display: flex;
    gap: clamp(12px, 1.5vw, 24px);
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 13px;
    font-weight: 500;
  }
  .nav-links a { color: var(--cream); text-decoration: none; opacity: 0.85; }
  .nav-links a:hover { color: var(--yellow); opacity: 1; }
  .nav-label { display: none; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 700; }
  .nav-tabs { display: flex; gap: 4px; flex: none; }
  .nav-tab {
    padding: 7px 14px;
    border-radius: 100px;
    color: var(--cream);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-tab:hover { color: var(--yellow); }
  .nav-tab[aria-current="page"] { background: var(--cream); color: var(--ink); }
  main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 64px 24px 100px; }
  h1 {
    max-width: 900px;
    margin: 0;
    font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif;
    font-size: clamp(48px, 8vw, 94px);
    line-height: 0.98;
    letter-spacing: -0.045em;
  }
  h1 span { color: var(--pink); }
  .intro {
    max-width: 720px;
    margin: 28px 0 0;
    color: var(--ink-soft);
    font-size: clamp(17px, 2vw, 20px);
    line-height: 1.8;
  }
  footer {
    width: calc(100% - 48px);
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px 36px;
    border-top: 1px solid var(--rule);
    color: var(--ink-mute);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  @media (max-width: 600px) {
    main { padding: 44px 22px 72px; }
  }
  @media (max-width: 900px) {
    .nav-links { display: none; }
    .nav-label { display: block; }
  }
</style>
